<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
    <link rel="stylesheet" href="../vendor/tailwind/tailwind4.css" />
    <link rel="stylesheet" href="../vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../vendor/aos/aos.css" />
    <script src="../vendor/gsap/gsap.min.js"></script>
    <script src="../vendor/aos/aos.js"></script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../style/style.css" />
    <title>Join a room · Card Game</title>
  </head>
  <body>
    <div class="wrap cyberpunk-bg">
      <img
        src="../assets/img/gg.png"
        alt="Spider-Man Right"
        class="absolute right-0 top-0 w-1/4 max-w-xs swing-right"
        data-aos="fade-left"
        data-aos-delay="600" />
      <div class="container">
        <div
          class="main__content flex items-center justify-center min-h-screen"
          data-aos="zoom-out"
          data-aos-delay="200">
          <div class="flex flex-col">
            <h1 class="title">Connecting to the game</h1>
            <input
              placeholder="Enter the room code"
              class="w-full p-2 bg-transparent text-white focus:outline-none border-2 border-green-300 rounded focus:border-green-500 pr-10 transition-colors duration-300 mb-8" />
            <button
              class="button px-10 py-5 text-2xl bg-gradient-to-r from-red-500 to-orange-500 text-yellow-400 border-none rounded-[15px] cursor-pointer transition-all duration-300 shadow-[0_5px_15px_rgba(255,64,64,0.5)] hover:scale-[1.03] hover:shadow-[0_10px_25px_rgba(255,64,64,0.7)]">
              Connect
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
<script>
    AOS.init();
  </script>
  <script type="module" src="../utils/connect-room.js"></script>
  <script type="module" src="../demo/banner.js"></script>
</html>
